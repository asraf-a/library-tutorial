{% extends "base_generic.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center py-4">
    <div class="form-card w-100" style="max-width: 460px;">
        <div class="text-center mb-4">
            <div class="stat-icon indigo mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem; border-radius: 14px;">
                <i class="bi bi-key"></i>
            </div>
            <h1 class="form-card-title mb-1">Reset Password</h1>
            <p class="form-card-desc mb-0">Enter your email to receive a password reset link</p>
        </div>

        <form action="" method="post">
            {% csrf_token %}

            {% if form.email.errors %}
                <div class="alert-custom alert-danger-custom mb-3">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted" for="{{ form.email.id_for_label }}">Email Address</label>
                {{ form.email }}
            </div>

            <button type="submit" class="btn-primary-custom w-100 mt-2 py-2 justify-content-center">
                <i class="bi bi-envelope"></i>
                <span>Send Reset Link</span>
            </button>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="small text-muted text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to login
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
