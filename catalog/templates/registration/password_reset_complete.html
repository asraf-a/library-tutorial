{% extends "base_generic.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center py-5">
    <div class="form-card text-center w-100" style="max-width: 440px;">
        <div class="stat-icon emerald mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem; border-radius: 50%;">
            <i class="bi bi-shield-check"></i>
        </div>
        <h1 class="form-card-title mb-2">Password Updated</h1>
        <p class="text-muted mb-4">
            Your password has been successfully reset. You can now log in with your new credentials.
        </p>
        <a href="{{ login_url|default:'/accounts/login/' }}" class="btn-primary-custom text-decoration-none justify-content-center">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Log In Now</span>
        </a>
    </div>
</div>

{% endblock %}
