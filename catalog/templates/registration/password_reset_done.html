{% extends "base_generic.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center py-5">
    <div class="form-card text-center w-100" style="max-width: 480px;">
        <div class="stat-icon emerald mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem; border-radius: 50%;">
            <i class="bi bi-send-check"></i>
        </div>
        <h1 class="form-card-title mb-2">Check Your Inbox</h1>
        <p class="text-muted mb-4">
            We've emailed you instructions for setting your password. If they haven't arrived in a few minutes, check your spam folder.
        </p>
        <a href="{% url 'login' %}" class="btn-secondary-custom text-decoration-none justify-content-center">
            <i class="bi bi-arrow-left"></i>
            <span>Return to Login</span>
        </a>
    </div>
</div>

{% endblock %}
