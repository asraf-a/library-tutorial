{% extends "base_generic.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center py-5">
    <div class="form-card text-center w-100" style="max-width: 440px;">
        <div class="stat-icon emerald mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem; border-radius: 50%;">
            <i class="bi bi-check2"></i>
        </div>
        <h1 class="form-card-title mb-2">Signed Out</h1>
        <p class="text-muted mb-4">
            You have successfully logged out of your session.
        </p>
        <div class="d-flex flex-column gap-2">
            <a href="{% url 'login' %}" class="btn-primary-custom text-decoration-none justify-content-center">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Sign In Again</span>
            </a>
            <a href="{% url 'index' %}" class="btn-secondary-custom text-decoration-none justify-content-center">
                <span>Return to Home</span>
            </a>
        </div>
    </div>
</div>

{% endblock %}
